<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyper-V Control Center</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1120;
    --panel: #111b2e;
    --surface: #17243a;
    --border: #273851;
    --text: #e5edf8;
    --muted: #8fa5bf;
    --accent: #6ee7b7;
    --blue: #60a5fa;
    --warning: #fbbf24;
    --error: #fb7185;
    --radius: 10px;
    --gap: 14px;
    font-size: 15px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    line-height: 1.45;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr) auto;
    height: 100vh;
  }
  /* ---------- navigation ---------- */
  nav {
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  nav .brand { font-size: 1.4rem; font-weight: 700; letter-spacing: .06em; color: var(--accent); }
  nav .sub { color: var(--muted); font-size: .8rem; margin-bottom: 10px; }
  nav .vm { color: var(--blue); font-size: .85rem; word-break: break-all; }
  nav .meta { color: var(--muted); font-size: .78rem; margin-bottom: 14px; }
  /* One button per line: without this the buttons are inline-blocks and pair up
     two to a row as soon as the labels are short enough. */
  nav #nav-buttons { display: flex; flex-direction: column; gap: 4px; }
  nav button {
    width: 100%;
    text-align: left;
    padding: 10px 14px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    cursor: pointer;
  }
  nav button:hover { background: var(--surface); color: var(--text); }
  nav button.active { background: var(--surface); color: var(--text); font-weight: 600; }
  nav .caps { margin-top: auto; color: var(--muted); font-size: .78rem; white-space: pre-line; padding-top: 18px; }
  /* ---------- workspace tabs ---------- */
  nav #tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 8px; }
  nav #tabs .tab {
    display: flex; align-items: center; gap: 6px; max-width: 100%;
    padding: 4px 8px; border-radius: 7px; background: var(--surface);
    color: var(--muted); font-size: .78rem; cursor: pointer; border: 1px solid transparent;
  }
  nav #tabs .tab span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav #tabs .tab.active { color: var(--text); border-color: var(--border); }
  nav #tabs .tab .x { opacity: .55; padding: 0 2px; }
  nav #tabs .tab .x:hover { opacity: 1; color: var(--error); }
  nav .conn { margin-top: 12px; font-size: .74rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  nav .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  nav .conn.up .dot { background: var(--accent); }
  nav .conn.down .dot { background: var(--error); }
  /* A VM name in the fleet is a button: it opens a workspace, it is not a form. */
  table.events button.link { background: none; border: 0; color: var(--blue); font: inherit; cursor: pointer; padding: 0; text-align: left; }
  table.events button.link:hover { text-decoration: underline; }
  table.events .badge { font-size: .74rem; padding: 1px 7px; border-radius: 999px; background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
  table.events .badge.lab { color: var(--accent); border-color: #2f6b57; }
  table.events .badge.control { color: var(--blue); border-color: #2b4a72; }
  /* ---------- content ---------- */
  main { padding: 24px 26px; overflow-y: auto; min-width: 0; }
  header.page { margin-bottom: 18px; }
  header.page h1 { margin: 0 0 4px; font-size: 1.5rem; }
  header.page p { margin: 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--gap); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .card h2 { margin: 0 0 2px; font-size: 1rem; }
  .card .hint { margin: 0 0 12px; color: var(--muted); font-size: .82rem; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 10px; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); flex: 1 1 140px; }
  input, select, textarea {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 10px;
    font: inherit;
    font-size: .88rem;
    width: 100%;
  }
  textarea { resize: vertical; min-height: 72px; font-family: Consolas, "Cascadia Mono", monospace; }
  button.act {
    border: 0;
    border-radius: 7px;
    padding: 8px 14px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: .86rem;
    cursor: pointer;
  }
  button.act:hover { background: #243955; }
  button.act.primary { background: #175c4b; color: #d9fff1; font-weight: 600; }
  button.act.primary:hover { background: #207862; }
  button.act.danger { background: #4a1d28; color: #ffd8de; }
  button.act.danger:hover { background: #632434; }
  button.act:disabled { opacity: .5; cursor: not-allowed; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: .86rem; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; word-break: break-word; }
  .state { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .state.off { color: var(--muted); }
  .state.bad { color: var(--error); }
  /* Hidden until a capture exists: an <img> with no src draws the browser's
     broken-image icon and its alt text, which reads as a failure on a page
     that has simply not taken a screenshot yet. */
  .shot { width: 100%; border-radius: 8px; border: 1px solid var(--border); background: #000; display: none; }
  .shot.live { display: block; }
  /* The console is an <img> you can click and type into. It is a picture, so
     the coordinate space is the guest display, not the element's pixels. */
  .screen-wrap { position: relative; }
  .screen {
    width: 100%; display: block; border-radius: 8px; border: 1px solid var(--border);
    background: #000; cursor: crosshair; outline: none;
  }
  .screen:focus { border-color: var(--accent); }
  .screen-note {
    position: absolute; right: 8px; bottom: 8px; font-size: .72rem; color: var(--text);
    background: rgba(0, 0, 0, .6); padding: 2px 8px; border-radius: 999px; pointer-events: none;
  }
  .screen-empty { padding: 40px 12px; text-align: center; color: var(--muted); font-size: .85rem; border: 1px dashed var(--border); border-radius: 8px; }
  .checkpoint-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: .82rem; }
  .checkpoint-row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .checkpoint-row .when, .checkpoint-row .id { color: var(--muted); font-size: .72rem; }
  .checkpoint-row.baseline { background: rgba(70, 160, 120, .10); }
  .checkpoint-row .base { font-size: .72rem; color: var(--accent); border: 1px solid #2f6b57; border-radius: 999px; padding: 0 7px; white-space: nowrap; }
  .checkpoint-row .branch { color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .confirm { font-size: .78rem; color: var(--warning); }
  table.events { width: 100%; border-collapse: collapse; font-size: .82rem; }
  table.events th, table.events td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.events th { color: var(--muted); font-weight: 600; }
  table.events td.err { color: var(--error); }
  /* ---------- file manager ---------- */
  /* Two listings side by side are the point of the page, so a cell never
     widens its card: a long name wraps instead of pushing the other panel. */
  .files .card { min-width: 0; }
  .files table.events { table-layout: fixed; }
  .files table.events td { vertical-align: top; overflow-wrap: anywhere; }
  .files table.events td:last-child { white-space: nowrap; }
  .files .path {
    margin: 0 0 10px; font-family: Consolas, "Cascadia Mono", monospace;
    font-size: .8rem; color: var(--muted); overflow-wrap: anywhere;
  }
  table.events tr.pending { background: rgba(251, 191, 36, .10); }
  progress.transfer { width: 100%; height: 10px; accent-color: var(--accent); }
  .transfer-line { display: flex; justify-content: space-between; gap: 12px; font-size: .78rem; color: var(--muted); margin-top: 6px; }
  .transfer-line .digest { font-family: Consolas, "Cascadia Mono", monospace; overflow-wrap: anywhere; }
  /* ---------- output ---------- */
  #output {
    position: sticky;
    bottom: 0;
    margin-top: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-height: 40vh;
    display: none;
    flex-direction: column;
  }
  #output.open { display: flex; }
  #output header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  #output header span { color: var(--muted); font-size: .8rem; }
  #output pre { margin: 0; padding: 12px; overflow: auto; font-family: Consolas, "Cascadia Mono", monospace; font-size: .8rem; white-space: pre-wrap; word-break: break-word; }
  #output.failed { border-color: var(--error); }
  #output.failed header span { color: var(--error); }
  /* ---------- approvals ---------- */
  aside.approvals {
    width: 340px;
    padding: 22px 16px;
    border-left: 1px solid var(--border);
    overflow-y: auto;
    display: none;
    background: #0e1626;
  }
  aside.approvals.open { display: block; }
  aside.approvals h2 { margin: 0 0 4px; font-size: 1rem; color: var(--warning); }
  aside.approvals .hint { margin: 0 0 14px; color: var(--muted); font-size: .8rem; }
  .approval { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
  .approval .op { color: var(--accent); font-weight: 600; font-size: .9rem; }
  .approval .vm { color: var(--muted); font-size: .78rem; margin-bottom: 8px; }
  .approval pre { margin: 0 0 10px; max-height: 200px; overflow: auto; background: var(--surface); border-radius: 7px; padding: 8px; font-size: .76rem; white-space: pre-wrap; word-break: break-word; }
  .approval .row { margin: 0; justify-content: flex-end; }
  /* ---------- chooser ---------- */
  #chooser { position: fixed; inset: 0; background: rgba(4, 8, 16, .82); display: none; align-items: center; justify-content: center; padding: 24px; }
  #chooser.open { display: flex; }
  #chooser .card { width: min(560px, 100%); }
  #chooser ul { list-style: none; margin: 0 0 12px; padding: 0; max-height: 320px; overflow-y: auto; }
  #chooser li button { width: 100%; text-align: left; }
  .banner { background: #3a2a10; border: 1px solid #6b4b12; color: #ffe6b0; border-radius: 8px; padding: 10px 12px; font-size: .84rem; margin-bottom: 14px; }
  /* ---------- narrow window ---------- */
  @media (max-width: 1100px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) auto; }
    nav { flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--border); padding: 10px 12px; gap: 6px; overflow: visible; }
    nav .sub, nav .meta, nav .caps { display: none; }
    /* The bar wraps as one block of buttons; the column rule above would keep
       them stacked one per line and push the brand out of place. */
    nav #nav-buttons { flex-direction: row; flex-wrap: wrap; flex: 1 1 100%; gap: 4px; }
    nav button { width: auto; padding: 7px 10px; font-size: .82rem; }
    main { padding: 16px; }
    aside.approvals { width: auto; border-left: 0; border-top: 1px solid var(--border); max-height: 45vh; }
  }
</style>
</head>
<body>
<div class="app">
  <nav id="nav">
    <div class="brand">HYPER-V</div>
    <div class="sub">Control Center</div>
    <div class="vm" id="vm-name">no VM</div>
    <div class="meta" id="vm-meta"></div>
    <div id="tabs"></div>
    <div id="nav-buttons"></div>
    <div class="caps" id="caps"></div>
    <div class="conn" id="conn"><span class="dot"></span>connecting…</div>
  </nav>

  <main id="main">
    <div id="banner"></div>
    <div id="page"></div>
    <section id="output">
      <header>
        <span id="output-title">Result</span>
        <button class="act" onclick="document.getElementById('output').classList.remove('open')">Hide</button>
      </header>
      <pre id="output-body"></pre>
    </section>
  </main>

  <aside class="approvals" id="approvals">
    <h2>Waiting for you</h2>
    <p class="hint">The MCP server holds one operation open for each card. Nothing here is sent to the AI.</p>
    <div id="approval-list"></div>
  </aside>
</div>

<div id="chooser">
  <div class="card">
    <h2>Which virtual machine?</h2>
    <p class="hint">Hyper-V reported more than one. The choice applies to this window.</p>
    <ul id="chooser-list"></ul>
    <div class="row" style="margin:0">
      <input id="chooser-typed" placeholder="Or type a VM name">
      <button class="act primary" id="chooser-open">Open</button>
    </div>
  </div>
</div>

<script>
"use strict";

const PAGES = [
  ["Fleet", "fleet", "Every VM Hyper-V reported, the level this host allows each one, and its power."],
  ["Overview", "overview", "The VM's state, its checkpoints and what the AI may do with it."],
  ["Activity", "activity", "Cross-process operation history, including what the MCP server did."],
  ["Console", "console", "Keyboard, mouse and a screenshot of the guest display."],
  ["Checkpoints", "checkpoints", "The VM's tree of states, with the operator's baseline protected."],
  ["Recovery", "recovery", "Power, checkpoints and the forced actions that ask for a confirmation."],
  ["Media", "media", "The DVD drive, an ISO and boot order."],
  ["Debugger", "debugger", "COM1 serial, the kd session and the symbols it resolves."],
  ["Guest", "guest", "Credential source, automation toggles and one command."],
  ["Lab", "lab", "Directories, packages, diagnostics, and the cycle that runs one."],
  ["Files", "files", "Two panels: the host roots this window may browse, and the guest's own disk."],
];

const state = {
  vm: "", page: "fleet", hello: null, output: null,
  // The tabs are the workspaces: one per VM opened from the fleet, each one a
  // full set of pages for that VM. Several may be open; only one is active.
  tabs: [],
  // The live feed. `cursor` is the last sequence shown, so a reconnected window
  // asks for what it missed instead of starting over.
  events: [], cursor: 0, connected: null,
  // The checkpoint a click has asked to restore or delete, waiting for the
  // second click that means it. A modal would take the page away instead.
  confirm: null,
  // The file manager's own state: which root, where each panel is looking, the
  // row waiting for a second click, and the digest of the last transfer. It
  // outlives a render, because navigating a directory is a render.
  files: null,
};

/* ---------- small helpers ---------- */
const api = () => window.pywebview && window.pywebview.api;
const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key === "html") node.innerHTML = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== undefined && value !== null) node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
};

function panel(title, hint, ...body) {
  return el("section", { class: "card" }, el("h2", {}, title), hint ? el("p", { class: "hint" }, hint) : null, ...body);
}

function field(label, input) {
  return el("label", { class: "field" }, label, input);
}

function input_(name, value = "", type = "text") {
  return el("input", { id: name, type, value });
}

function facts(pairs) {
  const list = el("dl", { class: "facts" });
  for (const [term, value] of pairs) {
    // An empty cell reads as "the page did not load"; a dash says the host
    // reported nothing, which is a fact about the host.
    const shown = value === null || value === undefined || value === "" ? "—" : value;
    list.append(el("dt", {}, term), el("dd", {}, shown));
  }
  return list;
}

function show(method, response) {
  state.output = { method, response };
  const box = document.getElementById("output");
  const body = document.getElementById("output-body");
  document.getElementById("output-title").textContent = method;
  body.textContent = JSON.stringify(response, null, 2);
  box.classList.toggle("failed", Boolean(response && response.error));
  box.classList.add("open");
}

async function call(method, kwargs) {
  try {
    const response = await api().call(method, kwargs || {});
    show(method, response);
    return response;
  } catch (error) {
    show(method, { error: { message: String(error) } });
    return { error: { message: String(error) } };
  }
}

function action(label, method, payload, style, then) {
  return el("button", {
    class: "act" + (style ? " " + style : ""),
    onclick: async (event) => {
      const button = event.currentTarget;
      button.disabled = true;
      try {
        await call(method, payload());
        if (then) await then();
      } finally {
        button.disabled = false;
      }
    },
  }, label);
}

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

// Not `value`: pywebview answers a JS -> Python call by evaluating `var value; ...`
// in the global scope, and a second `const value` makes that script a SyntaxError,
// which silently breaks every call from the page into Python.
const fieldValue = (id) => (document.getElementById(id) || {}).value || "";
const checked = (id) => Boolean((document.getElementById(id) || {}).checked);
const vmArg = () => ({ vm_name: state.vm });
const confirmed = () => ({ vm_name: state.vm, confirm_vm: state.vm });

/* ---------- pages ---------- */
const builders = {
  async fleet() {
    const response = await api().vms();
    const vms = (response && response.ok && response.ok.vms) || [];
    const levels = (state.hello && state.hello.levels_by_vm) || {};
    const levelOf = (name) => levels[String(name || "").toLowerCase()] || null;
    const badge = (level) => el("span", { class: "badge" + (level ? " " + level : "") }, level || "no level");
    const gib = (bytes) => (bytes ? (bytes / 2 ** 30).toFixed(1) + " GiB" : "—");

    const rows = vms.map((vm) => {
      const name = String(vm.name || "");
      const running = vm.state === "Running";
      return el("tr", {},
        el("td", {}, el("button", { class: "link", onclick: () => openVm(name) }, name)),
        el("td", {}, vm.state || "—"),
        el("td", {}, badge(levelOf(name))),
        el("td", {}, vm.cpu_usage_percent === undefined ? "—" : vm.cpu_usage_percent + "%"),
        el("td", {}, gib(vm.memory_assigned_bytes || vm.memory_startup_bytes)),
        el("td", {}, el("div", { class: "row", style: "margin:0;flex-wrap:wrap" },
          running
            ? [action("Shutdown", "power", () => ({ vm_name: name, action: "shutdown" }), null, render),
               action("Save", "power", () => ({ vm_name: name, action: "save" }), null, render),
               action("Turn off", "power", () => ({ vm_name: name, action: "turn_off", confirm_vm: name }), "danger", render)]
            : [action("Start", "power", () => ({ vm_name: name, action: "start" }), null, render)],
          el("button", { class: "act", onclick: () => openVm(name) }, "Open"))));
    });

    const empty = vms.length
      ? null
      : panel("No VM was reported", "Either Hyper-V returned none, or the allowlist hides them all.",
          el("p", { class: "hint", style: "margin:0" },
            "The allowlist is " + ((state.hello && state.hello.allowlist) || []).join(", ") +
            ". A VM outside it is not listed and cannot be opened."));

    return el("div", { class: "grid" },
      panel("Fleet", "What Hyper-V reports, and what this host allows each VM. The level is the operator's file, not this window's.",
        empty || el("table", { class: "events fleet" },
          el("thead", {}, el("tr", {}, ...["Name", "State", "Level", "CPU", "Memory", ""].map((h) => el("th", {}, h)))),
          el("tbody", {}, ...rows))),
      panel("This window", "A thin client of the same service the MCP server calls.",
        facts([
          ["Profile", state.hello ? state.hello.profile : "—"],
          ["Elevated", state.hello ? String(state.hello.elevated) : "—"],
          ["Service", state.hello ? (state.hello.shared_service ? "shared host" : "private copy") : "—"],
          ["Approvals", state.hello ? state.hello.approvals : "—"],
          ["Open workspaces", state.tabs.length ? state.tabs.join(", ") : "none"],
        ]),
        el("div", { class: "row", style: "margin:12px 0 0" },
          action("Refresh", "list_vms", () => ({}), null, render),
          el("button", { class: "act", onclick: openChooser }, "Type a VM name"))));
  },

  async overview() {
    const [host, vm, checkpoints] = await Promise.all([
      api().call("host_status", {}), api().call("get_vm", vmArg()), api().call("list_checkpoints", vmArg()),
    ]);
    const record = (vm && vm.ok && vm.ok.vm) || {};
    const levelSelect = el("select", { id: "level" },
      ...(state.hello.levels || []).map((name) => el("option", { value: name, selected: name === state.hello.level ? "selected" : null }, name)));
    return el("div", { class: "grid" },
      panel("State", "Read from the host, not from the guest.",
        el("div", { class: "state" + (record.state === "Running" ? "" : record.state ? " off" : "") }, record.state || "unknown"),
        facts([
          ["Name", record.name || state.vm],
          ["Processors", record.processor_count ?? "—"],
          ["Memory", record.memory_startup_bytes ? (record.memory_startup_bytes / 2 ** 30).toFixed(1) + " GiB" : "—"],
          ["Automatic checkpoints", record.automatic_checkpoints_enabled === undefined ? "—" : String(record.automatic_checkpoints_enabled)],
        ])),
      panel("Host", "Whether this process can administer it at all.",
        facts([
          ["Hypervisor", host && host.ok ? String(host.ok.hypervisor_present) : "unreadable"],
          ["Logical processors", host && host.ok ? host.ok.logical_processor_count : "—"],
          ["Elevated", String(state.hello.elevated)],
          ["Service", state.hello.shared_service ? "shared host" : "private copy"],
          ["Approvals", state.hello.approvals],
        ])),
      panel("Access level", "The file hyperv-access writes. No tool can change it.",
        el("p", { class: "hint", id: "level-note" }, state.hello.level
          ? state.vm + " is " + state.hello.level + "."
          : state.vm + " has no level, so no tool can reach it."),
        el("div", { class: "row" }, field("Level", levelSelect)),
        el("div", { class: "row", style: "margin:0" },
          el("button", { class: "act primary", onclick: () => writeLevel(fieldValue("level")) }, "Apply level"),

  async checkpoints() {
    const listing = await api().call("list_checkpoints", vmArg());
    const result = (listing && listing.ok) || {};
    const rows = checkpointTree(result.checkpoints || []);
    const baseline = result.baseline || null;
    const pending = state.confirm;

    const controls = (checkpoint) => {
      const id = String(checkpoint.id || "");
      const name = String(checkpoint.name || "");
      if (pending && pending.id === id) {
        return el("span", { class: "confirm" },
          (pending.kind === "restore" ? "Restore to this state?" : "Delete this checkpoint?"),
          el("button", { class: "act danger", onclick: () => confirmCheckpoint(pending) }, "Yes"),
          el("button", { class: "act", onclick: () => { state.confirm = null; render(); } }, "Cancel"));
      }
      return el("span", {},
        // A restore is the safe direction: it puts the guest back on the state
        // the checkpoint already holds. A delete is the one that loses data.
        el("button", { class: "act", onclick: () => { state.confirm = { kind: "restore", id, name }; render(); } }, "Restore"),
        checkpoint.baseline
          ? null
          : el("button", { class: "act danger", onclick: () => { state.confirm = { kind: "delete", id, name }; render(); } }, "Delete"),
        checkpoint.baseline
          ? null
          : el("button", { class: "act", onclick: () => setBaseline(name) }, "Make baseline"),
        checkpoint.baseline
          ? el("button", { class: "act", onclick: () => setBaseline("") }, "Clear baseline")
          : null);
    };

    const tree = rows.length
      ? el("div", {}, ...rows.map(({ checkpoint, depth }) => el("div", {
          class: "checkpoint-row" + (checkpoint.baseline ? " baseline" : ""),
        },
        el("span", { class: "branch" }, depth ? "└" + "─".repeat(Math.max(0, depth - 1)) + " " : ""),
        el("span", { class: "grow", title: String(checkpoint.id || "") },
          String(checkpoint.name || "(unnamed)"),
          el("span", { class: "when" }, " · " + String(checkpoint.creation_time || "").slice(0, 19).replace("T", " "))),
        checkpoint.baseline ? el("span", { class: "base" }, "baseline") : null,
        controls(checkpoint))))
      : el("p", { class: "hint", style: "margin:0" }, "This VM has no checkpoints.");

    return el("div", { class: "grid" },
      panel("Checkpoints",
        baseline
          ? `The baseline is “${baseline}”: it can be restored to, never deleted, by this window or by the AI.`
          : "No baseline is set for this VM. Mark the state the guest should always return to, and nothing may delete it.",
        tree,
        el("div", { class: "row", style: "margin:12px 0 0" },
          action("Refresh", "list_checkpoints", vmArg))),
      panel("Create a checkpoint", "Take one before anything that could break the guest.",
        el("div", { class: "row" }, field("Name", input_("cp-name", "before-lab"))),
        el("div", { class: "row" },
          action("Create", "create_checkpoint", () => ({ vm_name: state.vm, name: fieldValue("cp-name") }), "primary", render)),
        el("p", { class: "hint", style: "margin:10px 0 0" },
          baseline
            ? `“${baseline}” is taken by the baseline; a new checkpoint needs another name.`
            : "A name is required; Hyper-V does not keep them unique, so pick something you will recognise.")));
  },

  async files() {
    const files = fileState();
    const roots = await api().call("file_roots", {});
    const listed = (roots && roots.ok && roots.ok.roots) || [];
    // A root that vanished from the configuration must not stay selected: the
    // page asks for what the service named, not for what it remembered.
    if (!listed.some((root) => root.name === files.root)) {
      files.root = ((listed.find((root) => root.exists) || listed[0]) || {}).name || "";
    }
    const chosen = listed.find((root) => root.name === files.root) || null;
    const host = chosen
      ? await api().call("host_list_dir", { root: files.root, path: files.host })
      : null;
    const guest = await api().call("guest_list_dir", { vm_name: state.vm, guest_path: files.guest });
    const hostDirectory = (host && host.ok && host.ok.directory) || null;
    const guestDirectory = (guest && guest.ok && guest.ok.directory) || null;

    const up = (side, value) => {
      const parent = dropLast(value);
      if (parent === value) return null;
      return async () => {
        files[side] = parent;
        files.pending = null;
        await render();
      };
    };
    const pathLine = (text, back) =>
      el("div", { class: "row", style: "margin:0 0 10px;align-items:center" },
        el("span", { class: "path", style: "margin:0" }, text || "(root)"),
        back ? el("button", { class: "act", onclick: back }, "Up") : null);

    const hostPanel = panel("Host", "The four roots this server was configured with, and nothing outside them. A path that resolves elsewhere is refused.",

        ? el("div", { class: "row" },
            field("Root", el("select", { id: "file-root" },
              ...listed.map((root) => el("option", {
                value: root.name, selected: root.name === files.root ? "selected" : null,

      chosen ? pathLine(hostFull(chosen.path, files.host), files.host ? up("host", files.host) : null) : null,

        field("Delete folders recursively", el("input", { id: "file-host-recursive", type: "checkbox" }))));

    const guestPanel = panel("Guest", "The lab machine's own disk, reached over the configured transport. Deleting asks for a second click.",
      el("div", { class: "row" },
        field("Path", input_("file-guest-path", files.guest)),
        el("button", {
          class: "act",
          onclick: async () => {
            files.guest = fieldValue("file-guest-path");
            files.pending = null;
            await render();
          },
        }, "Go")),
      pathLine(files.guest, up("guest", files.guest)),
      guestDirectory
        ? fileTable(guestDirectory.entries, "guest", files, chosen)

      el("div", { class: "row", style: "margin:12px 0 0" },
        field("New folder here", input_("file-guest-new", "")),
        el("button", {
          class: "act primary",
          onclick: () => fileOp("guest_make_dir", {
            vm_name: state.vm, guest_path: joinPath(files.guest, fieldValue("file-guest-new")),
          }),
        }, "Create")),
      el("div", { class: "row", style: "margin:8px 0 0" },
        field("Overwrite a file written here", el("input", { id: "file-to-guest-overwrite", type: "checkbox" })),
        field("Delete folders recursively", el("input", { id: "file-guest-recursive", type: "checkbox" }))));

    const transfer = panel("Transfers", "The bytes cross through the service, so the feed carries their progress and the digest is the one the far side computed.",
      el("progress", { class: "transfer", id: "transfer-bar", max: "100", value: "0" }),
      el("div", { class: "transfer-line" },
        el("span", { id: "transfer-label" }, "no transfer yet"),
        el("span", { class: "digest", id: "transfer-detail" }, "")),
      files.last
        ? el("p", { class: "hint", style: "margin:8px 0 0" },
            "Last: " + files.last.method + " → " + files.last.path + " · " + files.last.size +
            " bytes · sha256 " + files.last.sha256)
        : null);

    return el("div", {},
      el("div", { class: "grid files" }, hostPanel, guestPanel),
      el("div", { style: "margin-top:14px" }, transfer));
  },
};

/* ---------- the pieces that are not a form ---------- */
async function writeLevel(level) {
  try {
    const response = level ? await api().set_level(level) : await api().remove_level();
    show(level ? "set_level" : "remove_level", response);
  } catch (error) {
    show("set_level", { error: { message: String(error) } });
  }
  await refreshHello();
  await render();
}

/* ---------- the guest screen ---------- */
// A few frames a second is enough to follow a boot, and every frame is a full
// capture over the pipe: a video rate would saturate the service for no gain.
const SCREEN_INTERVAL_MS = 800;
let screenTimer = null;
let screenPaused = false;
let screenVm = "";

function stopScreen() {
  if (screenTimer) { clearTimeout(screenTimer); screenTimer = null; }
  screenVm = "";
  screenPaused = false;
}

function startScreen(vmName) {
  stopScreen();
  screenVm = String(vmName || "");
  scheduleScreen();
}

function scheduleScreen() {
  if (screenTimer) clearTimeout(screenTimer);
  screenTimer = setTimeout(screenFrame, SCREEN_INTERVAL_MS);
}

function screenNote(text) {
  const note = document.getElementById("screen-note");
  if (note) note.textContent = text;
}

function syncScreenButton() {
  const button = document.getElementById("screen-toggle");
  if (button) button.textContent = screenPaused ? "Resume" : "Pause";
}

async function screenFrame() {
  screenTimer = null;
  const vm = screenVm;
  const image = document.getElementById("screen");
  // The page was rebuilt, the workspace closed, or the window moved on: the
  // element is what says the loop is still wanted.
  if (!image || !vm || state.page !== "console") return;
  // A hidden window is not being looked at; the VM keeps running regardless.
  if (document.hidden || screenPaused) { if (screenVm === vm) scheduleScreen(); return; }
  try {
    const response = await api().screenshot({ max_width: 1600 });
    // The capture takes a while; the workspace may have moved on meanwhile.
    if (screenVm !== vm) return;
    if (!response || !response.ok) {
      // Off, paused, or the level has no screenshots: stop asking rather than
      // repeating a refusal several times a second.
      screenNote((response && response.error && response.error.message) || "capture failed");
      screenPaused = true;
      syncScreenButton();
      return;
    }
    applyShot(response.ok);
  } catch (error) {
    if (screenVm !== vm) return;
    screenNote(String(error));
    screenPaused = true;
    syncScreenButton();
    return;
  }
  scheduleScreen();
}

function applyShot(shot) {
  const image = document.getElementById("screen");
  if (!image) return;
  const metadata = shot.metadata || {};
  image.src = shot.src;
  // The video head is the coordinate space the mouse tools use, so the mapping
  // from the element to the guest needs the head size, not the PNG's.
  image.dataset.sourceWidth = metadata.source_width || "";
  image.dataset.sourceHeight = metadata.source_height || "";
  screenNote((metadata.width || "?") + "×" + (metadata.height || "?") + " · live");
}

async function captureOnce() {
  const response = await api().screenshot({ max_width: 1600 });
  if (response && response.ok) {
    applyShot(response.ok);
    show("console_screenshot", { ok: { metadata: response.ok.metadata } });
  } else {
    show("console_screenshot", response);
  }
}

function toggleScreen() {
  if (!screenVm) {
    startScreen(state.vm);
  } else {
    screenPaused = !screenPaused;
    if (!screenPaused && !screenTimer) scheduleScreen();
  }
  syncScreenButton();
}

function guestPoint(image, event) {
  const rect = image.getBoundingClientRect();
  if (!rect.width || !rect.height) return { x: 0, y: 0 };
  const width = Number(image.dataset.sourceWidth) || image.naturalWidth || rect.width;
  const height = Number(image.dataset.sourceHeight) || image.naturalHeight || rect.height;
  const clamp = (value) => Math.max(0, Math.min(32767, value));
  return {
    x: clamp(Math.round(((event.clientX - rect.left) / rect.width) * width)),
    y: clamp(Math.round(((event.clientY - rect.top) / rect.height) * height)),
  };
}

async function clickGuest(event, button) {
  const image = event.currentTarget;
  const point = guestPoint(image, event);
  image.focus();
  const x = document.getElementById("mouse-x");
  const y = document.getElementById("mouse-y");
  if (x) x.value = point.x;
  if (y) y.value = point.y;
  await call("console_click", { ...vmArg(), x: point.x, y: point.y, button });
}

/* ---------- keyboard ---------- */
// Names the service accepts for `console_press_keys`; anything else printable
// goes through `console_type_text`.
const KEY_BY_NAME = {
  Enter: "enter", Escape: "escape", Tab: "tab", Backspace: "backspace", Delete: "delete",
  Insert: "insert", Home: "home", End: "end", PageUp: "pageup", PageDown: "pagedown",
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
};
for (let number = 1; number <= 12; number += 1) KEY_BY_NAME["F" + number] = "f" + number;

let typed = "";
let typedTimer = null;

function queueText(text) {
  typed += text;
  if (typedTimer) clearTimeout(typedTimer);
  // One call per pause, not per character: each call is a pipe round trip.
  typedTimer = setTimeout(() => { typedTimer = null; flushText(); }, 250);
}

async function flushText() {
  if (typedTimer) { clearTimeout(typedTimer); typedTimer = null; }
  const text = typed;
  typed = "";
  if (!text) return;
  await call("console_type_text", { ...vmArg(), text });
}

async function keyGuest(event) {
  // A modifier combination is not text; the buttons above cover the ones the
  // service supports (Ctrl+Alt+Del), and the rest have no tool to reach them.
  if (event.ctrlKey || event.altKey || event.metaKey) return;
  const name = KEY_BY_NAME[event.key];
  if (name) {
    event.preventDefault();
    await flushText();
    await call("console_press_keys", { ...vmArg(), keys: [name] });
    return;
  }
  // The guest keyboard takes ASCII; anything else is dropped rather than
  // refused by the service.
  if (event.key.length === 1 && event.key >= " " && event.key <= "~") {
    event.preventDefault();
    queueText(event.key);
  }
}

/* ---------- checkpoints ---------- */
function checkpointTree(checkpoints) {
  // Hyper-V reports a flat list with parent ids; the page draws the branches.
  const byId = new Map(checkpoints.map((checkpoint) => [String(checkpoint.id || ""), checkpoint]));
  const children = new Map();
  const roots = [];
  for (const checkpoint of checkpoints) {
    const parent = String(checkpoint.parent_snapshot_id || "");
    if (parent && byId.has(parent) && parent !== String(checkpoint.id || "")) {
      if (!children.has(parent)) children.set(parent, []);
      children.get(parent).push(checkpoint);
    } else {
      roots.push(checkpoint);
    }
  }
  const ordered = [];
  const seen = new Set();
  const walk = (checkpoint, depth) => {
    const id = String(checkpoint.id || "");
    if (seen.has(id)) return;
    seen.add(id);
    ordered.push({ checkpoint, depth });
    for (const child of children.get(id) || []) walk(child, depth + 1);
  };
  for (const root of roots) walk(root, 0);
  return ordered;
}

async function setBaseline(name) {
  try {
    show("set_baseline", { ok: await api().set_baseline(String(name || "")) });
  } catch (error) {
    show("set_baseline", { error: { message: String(error) } });
  }
  // The service re-read the file; the window's copy of the policy is stale now.
  await refreshHello();
  await render();
}

async function confirmCheckpoint(pending) {
  state.confirm = null;
  const payload = {
    vm_name: state.vm, snapshot_id: pending.id,
    confirm_vm: state.vm, confirm_snapshot_id: pending.id,
  };
  await call(pending.kind === "restore" ? "restore_checkpoint" : "delete_checkpoint", payload);
  await render();
}

/* ---------- the file manager ---------- */
// The panels' own memory: where each one is looking, the row waiting for its
// second click, the entry being renamed, and the digest of the last transfer.
// A render rebuilds the page, so this cannot live in a local variable.
function fileState() {
  if (!state.files) {
    state.files = { root: "", host: "", guest: "C:\\DriverLab", renaming: null, pending: null, last: null };
  }
  return state.files;
}

const dropLast = (path) => {
  const text = String(path || "");
  const cut = text.lastIndexOf("\\");
  if (cut < 0) return "";
  const head = text.slice(0, cut);
  return /^[A-Za-z]:$/.test(head) ? head + "\\" : head;
};

// A path as the service names one: backslashes, no doubled separator. The host
// listing is relative to its root, so this is also how a listed entry becomes
// the `local_path` a transfer takes.
const joinPath = (base, name) => {
  const head = String(base || "").replace(/\\+$/, "");
  const tail = String(name || "").replace(/^\\+/, "");
  if (!tail) return head;
  return head ? head + "\\" + tail : tail;
};

const hostFull = (rootPath, relative) => joinPath(rootPath, relative);

function fileTable(entries, side, files, chosen) {
  if (!entries.length) return el("p", { class: "hint" }, "This directory is empty.");
  return el("table", { class: "events" },
    el("thead", {}, el("tr", {}, ...["Name", "Kind", "Size", ""].map((head) => el("th", {}, head)))),
    el("tbody", {}, ...entries.map((entry) => fileRow(entry, side, files, chosen))));
}

function fileRow(entry, side, files, chosen) {
  const isDirectory = entry.type === "directory";
  const full = side === "host" ? hostFull(chosen ? chosen.path : "", entry.path) : entry.path;
  const key = side + ":" + full;
  const pending = Boolean(files.pending && files.pending.key === key);
  const open = async () => {
    if (side === "host") files.host = entry.path; else files.guest = entry.path;
    files.pending = null;
    files.renaming = null;
    await render();
  };

  const nameCell = files.renaming === key
    ? el("div", { class: "row", style: "margin:0" },
        el("input", { id: "file-rename", value: entry.name }),
        el("button", { class: "act primary", onclick: () => renameEntry(side, entry, files) }, "Rename"),
        el("button", { class: "act", onclick: async () => { files.renaming = null; await render(); } }, "Cancel"))
    : isDirectory
      ? el("button", { class: "link", onclick: open }, entry.name)
      : entry.name;

  const actions = [];
  if (isDirectory) {
    actions.push(el("button", { class: "act", onclick: open }, "Open"));
  } else if (entry.type === "file") {
    actions.push(el("button", {
      class: "act primary", onclick: () => copyEntry(side, entry, files, chosen),
    }, side === "host" ? "To guest →" : "To host →"));
  }
  actions.push(el("button", {
    class: "act",
    onclick: async () => { files.renaming = key; files.pending = null; await render(); },
  }, "Rename"));
  actions.push(pending
    ? el("button", { class: "act danger", onclick: () => deleteEntry(side, entry, files) }, "Confirm delete")
    : el("button", {
        class: "act",
        onclick: async () => { files.pending = { key }; files.renaming = null; await render(); },
      }, "Delete"));

  return el("tr", { class: pending ? "pending" : "" },
    el("td", {}, nameCell),
    el("td", {}, entry.type),
    el("td", {}, isDirectory || entry.size === null || entry.size === undefined ? "—" : entry.size),
    el("td", {}, el("div", { class: "row", style: "margin:0;flex-wrap:wrap" }, ...actions)));
}

async function fileOp(method, payload) {
  await call(method, payload);
  await render();
}

async function renameEntry(side, entry, files) {
  const name = fieldValue("file-rename");
  const response = side === "host"
    ? await call("host_rename", { root: files.root, path: entry.path, new_name: name })
    : await call("guest_rename", { vm_name: state.vm, guest_path: entry.path, new_name: name });
  if (response && response.ok) files.renaming = null;
  await render();
}

async function deleteEntry(side, entry, files) {
  const recursive = checked(side === "host" ? "file-host-recursive" : "file-guest-recursive");
  const response = side === "host"
    ? await call("host_delete", {
        root: files.root, path: entry.path, confirm_path: entry.path, recursive,
      })
    : await call("guest_delete", {
        vm_name: state.vm, guest_path: entry.path, confirm_path: entry.path, recursive,
      });
  if (response && response.ok) files.pending = null;
  await render();
}

async function copyEntry(side, entry, files, chosen) {
  const rootPath = chosen ? chosen.path : "";
  if (side === "host") {
    const target = joinPath(files.guest, entry.name);
    const overwrite = checked("file-to-guest-overwrite");
    noteTransfer("guest_put_file", await call("guest_put_file", {
      vm_name: state.vm, local_path: hostFull(rootPath, entry.path),
      guest_path: target, overwrite, ...(overwrite ? { confirm_path: target } : {}),
    }));
  } else {
    const target = hostFull(rootPath, joinPath(files.host, entry.name));
    const overwrite = checked("file-to-host-overwrite");
    noteTransfer("guest_get_file", await call("guest_get_file", {
      vm_name: state.vm, guest_path: entry.path, local_path: target,
      overwrite, ...(overwrite ? { confirm_path: target } : {}),
    }));
  }
  await render();
}

function noteTransfer(method, response) {
  const file = response && response.ok && response.ok.file;
  if (!file) return;
  fileState().last = { method, path: file.path, size: file.size, sha256: file.sha256 };
}

function drawTransfer() {
  const bar = document.getElementById("transfer-bar");
  if (!bar) return;
  // The feed already carries the transfer; the bar reads it rather than
  // measuring anything of its own.
  const event = [...state.events].reverse().find((item) =>
    (item.operation === "guest_put_file" || item.operation === "guest_get_file") && item.phase === "progress");
  bar.value = event ? Number(event.progress) || 0 : 0;
  const label = document.getElementById("transfer-label");
  if (label) {
    label.textContent = event
      ? event.operation.replace("guest_", "").replace("_", " ") + " · " + event.progress + "% · " + (event.message || "")
      : "no transfer yet";
  }
  const detail = document.getElementById("transfer-detail");
  if (detail) detail.textContent = state.files && state.files.last ? "sha256 " + state.files.last.sha256 : "";
}

/* ---------- chrome ---------- */
function renderConn() {
  const node = document.getElementById("conn");
  if (!node) return;
  node.className = "conn " + (state.connected === true ? "up" : state.connected === false ? "down" : "");
  node.replaceChildren(el("span", { class: "dot" }),
    state.connected === true ? "service connected"
      : state.connected === false ? "service unreachable" : "connecting…");
}

function renderNav() {
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren(...state.tabs.map((name) =>
    el("div", {
      class: "tab" + (name === state.vm ? " active" : ""),
      title: name,
      onclick: () => openVm(name),
    },
    el("span", {}, name),
    el("span", {
      class: "x",
      title: "Close this workspace",
      onclick: (event) => { event.stopPropagation(); closeTab(name); },
    }, "×"))));

  // The fleet is always reachable; the per-VM pages need a VM to be about.
  const buttons = document.getElementById("nav-buttons");
  buttons.replaceChildren(...PAGES
    .filter(([, key]) => key === "fleet" || state.vm)
    .map(([label, key]) =>
      el("button", { class: key === state.page ? "active" : "", onclick: () => go(key) }, label)));

  document.getElementById("vm-name").textContent = state.vm || "no VM";
  const level = state.hello ? state.hello.level : null;
  document.getElementById("vm-meta").textContent = [
    state.vm ? state.vm + " · " + (level || "no level") : "",
    state.hello ? "profile " + state.hello.profile : "",
  ].filter(Boolean).join(" · ");
  const caps = state.hello ? state.hello.capabilities : {};
  document.getElementById("caps").textContent = Object.entries(caps)
    .map(([name, allowed]) => (allowed ? "● " : "○ ") + name).join("\n");
  document.getElementById("banner").replaceChildren(
    state.hello && !state.hello.elevated
      ? el("div", { class: "banner" }, "This process is not elevated. Hyper-V reads may fail with access_denied; that is the shell, not the service.")
      : "");
  renderConn();
}

function drawActivity() {
  const host = document.getElementById("activity-body");
  if (!host) return;
  const rows = state.events.slice(-300).reverse().map((event) => el("tr", {},
    el("td", {}, String(event.started_utc || "").slice(11, 19)),
    el("td", {}, event.actor || ""),
    el("td", {}, event.operation || ""),
    el("td", {}, event.vm_name || "host"),
    el("td", {}, event.phase + (event.progress !== null && event.progress !== undefined ? " " + event.progress + "%" : "")),
    el("td", { class: event.error_code ? "err" : "" }, event.error_code || "")));
  host.replaceChildren(el("table", { class: "events" },
    el("thead", {}, el("tr", {}, ...["Time", "Actor", "Operation", "VM", "Phase", "Error"].map((h) => el("th", {}, h)))),
    el("tbody", {}, ...rows)));
}

async function render() {
  // The page is about to be replaced, so the console's loop must let go of the
  // element it was drawing into; the console builder starts a new one.
  stopScreen();
  renderNav();
  const entry = PAGES.find(([, key]) => key === state.page) || PAGES[0];
  const page = document.getElementById("page");
  page.replaceChildren(el("header", { class: "page" }, el("h1", {}, entry[0]), el("p", {}, entry[2])));
  if (!state.vm && state.page !== "fleet") {
    page.append(panel("No VM is open", "Pick one from the fleet to open a workspace.",
      el("div", { class: "row", style: "margin:0" },
        el("button", { class: "act primary", onclick: () => go("fleet") }, "Open the fleet"))));
    return;
  }
  try {
    page.append(await builders[state.page]());
  } catch (error) {
    page.append(panel("This page could not read the host", String(error)));
  }
  if (state.page === "activity") drawActivity();
  if (state.page === "files") drawTransfer();
}

function go(key) {
  state.page = key;
  state.confirm = null;
  render();
}

/* ---------- workspaces ---------- */
async function openVm(name) {
  const chosen = String(name || "").trim();
  if (!chosen) return;
  // A confirmation belongs to the VM it was asked about, not to the next one.
  state.confirm = null;
  if (!state.tabs.some((tab) => tab.toLowerCase() === chosen.toLowerCase())) state.tabs.push(chosen);
  try {
    state.hello = await api().choose(chosen);
    state.vm = state.hello.vm;
  } catch (error) {
    show("choose", { error: { message: String(error) } });
    return;
  }
  if (state.page === "fleet") state.page = "overview";
  await render();
}

async function closeTab(name) {
  // Hyper-V names are case-insensitive, and the fleet may spell one differently
  // from the name the tab was opened with.
  const same = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();
  state.tabs = state.tabs.filter((tab) => !same(tab, name));
  if (!same(state.vm, name)) {
    await render();
    return;
  }
  const next = state.tabs[0];
  if (next) {
    state.page = "overview";
    await openVm(next);
    return;
  }
  try {
    state.hello = await api().choose("");
  } catch (error) {
    show("choose", { error: { message: String(error) } });
  }
  state.vm = "";
  state.page = "fleet";
  await render();
}

/* ---------- the live feed ---------- */
let watching = false;
async function watchEvents() {
  if (!api() || watching) return;
  watching = true;
  try {
    while (api()) {
      let failed = false;
      try {
        const response = await api().events(state.cursor, 10);
        if (response && response.ok) {
          state.connected = true;
          const arrived = response.ok.events || [];
          if (arrived.length) {
            state.events.push(...arrived);
            // The window is not a log store: keep the tail the page can draw.
            if (state.events.length > 800) state.events = state.events.slice(-800);
            state.cursor = Math.max(state.cursor, response.ok.latest_sequence || 0);
            if (state.page === "activity") drawActivity();
            if (state.page === "files") drawTransfer();
          } else if ((response.ok.latest_sequence || 0) > state.cursor) {
            state.cursor = response.ok.latest_sequence;
          }
        } else {
          failed = true;
        }
      } catch (error) {
        failed = true;
      }
      if (failed) {
        // The host is restarting or the pipe is busy; say so and try again
        // rather than drawing a feed that stopped updating without saying it.
        state.connected = false;
        await sleep(2000);
      }
      renderConn();
    }
  } finally {
    watching = false;
  }
}

async function refreshHello() {
  try {
    state.hello = await api().hello();
    state.vm = state.hello.vm || "";
  } catch (error) {
    state.hello = null;
  }
}

/* ---------- approvals ---------- */
let approvalSignature = "";
async function pollApprovals() {
  if (!api()) return;
  try {
    const requests = await api().approvals();
    const signature = JSON.stringify(requests.map((request) => request.request_id));
    if (signature !== approvalSignature) {
      approvalSignature = signature;
      const list = document.getElementById("approval-list");
      list.replaceChildren(...requests.map(approvalCard));
      document.getElementById("approvals").classList.toggle("open", requests.length > 0);
    }
  } catch (error) {
    /* the window is closing, or the bridge is not up yet */
  }
  setTimeout(pollApprovals, 800);
}

function approvalCard(request) {
  const summary = request.summary && request.summary.command_preview
    ? "Command preview (the guest runs exactly this):\n\n" + request.summary.command_preview +
      "\n\n" + JSON.stringify({ ...request.summary, command_preview: undefined }, null, 2)
    : JSON.stringify(request.summary || {}, null, 2);
  return el("div", { class: "approval" },
    el("div", { class: "op" }, request.operation || "unknown operation"),
    el("div", { class: "vm" }, "VM: " + (request.vm_name || "host")),
    el("pre", {}, summary),
    el("div", { class: "row" },
      el("button", { class: "act", onclick: () => decide(request.request_id, false) }, "Deny"),
      el("button", { class: "act primary", onclick: () => decide(request.request_id, true) }, "Approve once")));
}

async function decide(requestId, approved) {
  try {
    await api().decide(requestId, approved);
  } catch (error) {
    show("decide", { error: { message: String(error) } });
  }
  approvalSignature = "";
  pollApprovals();
}

/* ---------- choosing a VM ---------- */
async function openChooser() {
  const response = await api().vms();
  const names = ((response && response.ok && response.ok.vms) || []).map((vm) => vm.name);
  const list = document.getElementById("chooser-list");
  list.replaceChildren(...names.map((name) =>
    el("li", {}, el("button", { class: "act", onclick: () => pick(name) }, name))));
  document.getElementById("chooser").classList.add("open");
}

async function pick(name) {
  const chosen = String(name || "").trim();
  if (!chosen) return;
  document.getElementById("chooser").classList.remove("open");
  await openVm(chosen);
}

/* ---------- boot ---------- */
async function boot() {
  document.getElementById("chooser-open").addEventListener("click", () => pick(fieldValue("chooser-typed")));
  await refreshHello();
  // The VM the window started on is already open, so it gets a tab.
  if (state.vm) {
    state.tabs = [state.vm];
    state.page = "overview";
  }
  await render();
  pollApprovals();
  watchEvents();
}

window.addEventListener("pywebviewready", boot);
</script>
</body>
