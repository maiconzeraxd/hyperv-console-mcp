[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperv-console-mcp"
dynamic = ["version"]
description = "A local, policy-gated MCP server for Hyper-V management, guest automation, and console input."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "hyperv-console-mcp contributors" }]
keywords = ["hyper-v", "mcp", "windows", "virtualization", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Systems Administration",
]
dependencies = ["mcp>=2.3,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff==0.17.3"]
# Optional guest transport. paramiko is imported lazily, so `auto`/`psdirect`
# users never need it installed.
ssh = ["paramiko>=3.4,<4"]
# Optional WebView2 window. Imported lazily too: without it `hyperv-dashboard`
# opens the tkinter window, which needs nothing extra.
ui = ["pywebview>=5.4,<7"]
# Optional notification-area icon. pystray draws it with the Pillow this package
# already requires; without it `hyperv-tray` says so and exits.
tray = ["pystray>=0.19,<1"]

[project.scripts]
hyperv-console-mcp = "hyperv_console_mcp.cli:main"
hyperv-lab = "hyperv_console_mcp.lab.cli:main"
hyperv-dashboard = "hyperv_console_mcp.dashboard:main"
hyperv-tray = "hyperv_console_mcp.tray:main"
hyperv-access = "hyperv_console_mcp.access_cli:main"
hyperv-install = "hyperv_console_mcp.install:main"
hyperv-setup = "hyperv_console_mcp.setup:main"
hyperv-service = "hyperv_console_mcp.service.host:main"

[tool.setuptools.dynamic]
version = { attr = "hyperv_console_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hyperv_console_mcp = ["bridge/*.ps1", "lab/guest/*.ps1", "lab/guest/*.psm1", "transport/*.ps1", "webui/assets/*.html", "webui/assets/vendor/*"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
