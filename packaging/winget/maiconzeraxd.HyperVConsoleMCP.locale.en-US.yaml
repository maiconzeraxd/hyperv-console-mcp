ShortDescription: A local, policy-gated MCP server and window for Hyper-V management and driver labs.
Description: >-
  Hyper-V Console is an MCP server an AI client can drive and a window a person
  can use, both clients of one background service. Access is granted per virtual
  machine — read-only, control or lab — and the lab level adds guest automation,
  checkpoints, a kernel debugger and evidence collection. It never enables test
  signing, loads no driver and bypasses no signature enforcement on the host.
