name: release

# A tag is the only thing that produces artifacts. The workflow is also runnable
# by hand, which builds the same files and stops at the upload — useful for
# trying a change to the spec without tagging anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Both empty until a certificate is added as a repository secret. The
      # build signs when they exist and says plainly when they do not.
      SIGNING_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and build tools
        run: python -m pip install -e ".[dev,ui]" pyinstaller
      - name: Test before shipping anything
        run: python -m pytest -q
      - name: Freeze
        run: pyinstaller packaging/hyperv-console-mcp.spec --noconfirm --distpath dist --workpath build/pyinstaller
      - name: Check the frozen programs run
        shell: pwsh
        run: |
          # A console program, so --help proves the bundle imports and starts.
          # The launcher is windowed and the host opens a pipe; neither can be
          # asked anything useful from here without a VM.
          & dist\HyperVConsoleMCP\hyperv-access.exe --help
          if ($LASTEXITCODE -ne 0) { throw "the frozen access tool did not run" }
          Get-ChildItem dist\HyperVConsoleMCP -Filter *.exe | Select-Object Name, Length
      - name: Build the package
        run: python -m build
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $version = python -c "import hyperv_console_mcp; print(hyperv_console_mcp.__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DSourceDir=$root\dist\HyperVConsoleMCP" `
            "/DSetupIcon=$root\dist\icon.ico" `
            "packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist\installer | Select-Object Name, Length
      - name: Sign
        if: env.SIGNING_CERT != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT))
          try {
            $files = @(Get-ChildItem dist\HyperVConsoleMCP -Filter *.exe) +
                     @(Get-ChildItem dist\installer -Filter *.exe)
            foreach ($file in $files) {
              & signtool sign /f $pfx /p $env:SIGNING_PASSWORD /fd SHA256 `
                /tr http://timestamp.digicert.com /td SHA256 $file.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($file.Name)" }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Say whether these artifacts are signed
        if: env.SIGNING_CERT == ''
        run: echo "::warning::No signing certificate in secrets. These artifacts are unsigned and SmartScreen will warn on first run."
      - name: Keep the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hyperv-console-mcp-windows
          path: |
            dist/installer/*.exe
            dist/hyperv_console_mcp-*.whl
            dist/hyperv_console_mcp-*.tar.gz
      - name: Open a draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create ${{ github.ref_name }} `
            (Get-ChildItem dist\installer\*.exe).FullName `
            (Get-ChildItem dist\hyperv_console_mcp-*.whl).FullName `
            --draft --generate-notes --title "Hyper-V Console ${{ github.ref_name }}"
