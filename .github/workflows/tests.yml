name: tests

on:
  push:
    branches: [main, v0.2-autonomous-lab, v0.3]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem src, tests -Recurse -Include *.ps1, *.psm1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count) {
            $allErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Analyze PowerShell with PSScriptAnalyzer
        shell: pwsh
        run: |
          try { Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop } catch { Write-Host "PSGallery already trusted or unavailable: $($_.Exception.Message)" }
          Install-Module PSScriptAnalyzer -Force -AllowClobber -Confirm:$false -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path src -Recurse -Severity Error, Warning
          if ($results.Count) {
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String | Write-Host
            exit 1
          }
          Write-Host 'PSScriptAnalyzer: no errors or warnings.'
      - name: Run tests
        run: python -m pytest
      - name: Check MCP stdio and disabled mutations
        run: python -I tests/mcp_smoke.py
      - name: Build package
        run: python -m build

  # The suite is expected to run clean on Linux: the Windows-only tests carry a
  # skipif, and every ctypes/WinDLL use is inside a function, so importing a
  # module here proves the laziness as well as the logic.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Run unit tests
        run: python -m pytest
      - name: Import Windows-specific modules safely
        run: python -I -c "import hyperv_console_mcp.capture, hyperv_console_mcp.ipc, hyperv_console_mcp.serial"
